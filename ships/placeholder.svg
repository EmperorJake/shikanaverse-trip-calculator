<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
  <!-- Placeholder starship design -->
  <defs>
    <linearGradient id="shipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main hull -->
  <polygon points="200,50 280,150 260,250 140,250 120,150" fill="url(#shipGradient)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Cabin/Bridge -->
  <circle cx="200" cy="100" r="25" fill="#00d4ff" opacity="0.8"/>
  
  <!-- Engine glow -->
  <ellipse cx="160" cy="240" rx="15" ry="30" fill="#7b2ff7" opacity="0.6"/>
  <ellipse cx="240" cy="240" rx="15" ry="30" fill="#7b2ff7" opacity="0.6"/>
  
  <!-- Text label -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="16" fill="#00d4ff" text-anchor="middle">
    Placeholder Starship
  </text>
</svg>
