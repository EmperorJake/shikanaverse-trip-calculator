<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikanaverse Trip Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Shikanaverse Trip Calculator</h1>
            <p class="subtitle">Calculate your interstellar journey time</p>
        </header>

        <main>
            <!-- Starship Selector Section -->
            <div class="starship-section">
                <div class="starship-display">
                    <img id="shipImage" src="ships/placeholder.svg" alt="Starship" class="ship-image">
                </div>

                <div class="starship-nav">
                    <button type="button" id="prevShip" class="nav-button">❮</button>
                    <button type="button" id="nextShip" class="nav-button">❯</button>
                </div>

                <div class="starship-stats">
                    <div class="stat-row">
                        <span class="stat-label">Name:</span>
                        <span class="stat-value" id="shipName">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Class:</span>
                        <span class="stat-value" id="shipClass">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Max Warp:</span>
                        <span class="stat-value" id="shipMaxWarp">-</span>
                    </div>
                </div>
            </div>

            <form id="calculatorForm">
                <div class="form-group">
                    <label for="distance">Distance</label>
                    <div class="input-group">
                        <input 
                            type="number" 
                            id="distance" 
                            placeholder="Enter distance" 
                            required
                            min="0"
                            step="0.1"
                        >
                        <select id="distanceUnit">
                            <option value="earth">Earth Light Years</option>
                            <option value="pamaruk">Pamaruk Light Years</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="speedInput">Speed</label>
                    <div class="input-group">
                        <input 
                            type="number" 
                            id="speedInput" 
                            placeholder="Enter warp factor" 
                            required
                            min="0"
                            step="0.1"
                        >
                        <select id="speedMode">
                            <option value="warp">Warp Factor</option>
                            <option value="c">Speed (c)</option>
                        </select>
                    </div>
                    <small id="speedHelp">Speed in c = (warp factor)³</small>
                </div>

                <button type="submit" class="btn-calculate">Calculate Trip Time</button>
            </form>

            <div id="result" class="result hidden">
                <h2>Trip Details</h2>
                <div class="result-grid">
                    <div class="result-item">
                        <span class="result-label">Distance (Earth ly)</span>
                        <span class="result-value" id="resultDistanceEarth"></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Distance (Pamaruk ly)</span>
                        <span class="result-value" id="resultDistanceParamuk"></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Warp Factor</span>
                        <span class="result-value" id="resultWarpFactor"></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Speed (c)</span>
                        <span class="result-value" id="resultSpeed"></span>
                    </div>
                    <div class="result-item full-width">
                        <span class="result-label">Travel Time</span>
                        <span class="result-value" id="resultTime"></span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>For the Shikanaverse RPG</p>
        </footer>
    </div>

    <script src="ships/ships-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
